# ebay: eBay Sell-API MCP server (YosefHayim/ebay-mcp, from npm). Runs the
# package's native streamable-HTTP entrypoint (stateful: SDK session map in
# one long-lived process — no per-session children, cf. mail's
# supergateway). Included by the root docker-compose.yaml with
# project_directory rooted at the app dir (/opt/mcp on the host). Only Caddy
# shares the `ebay` network — inbound auth terminates at the vhost
# (OAUTH_ENABLED=false disables the server's own verifier), so nothing else
# may reach the unauthenticated backend.
#
# eBay credentials interpolate from the host .env (SSM SecureStrings). The
# refresh token is minted out-of-band via browser consent and seeded through
# terraform; it lives ~18 months and doesn't rotate on use, so expiry is a
# manual reseed — `make maintenance/ebay-token`, then apply + deploy (the
# server logs "update EBAY_USER_REFRESH_TOKEN" when it dies). Full
# procedure: README.md alongside this file.
services:
  ebay-mcp:
    build:
      context: ./services/ebay
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - ebay
    environment:
      # Transport: bind beyond loopback (default is localhost, unreachable
      # from Caddy's network) and skip the built-in OAuth verifier.
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8081
      - OAUTH_ENABLED=false
      # eBay app + user credentials (SSM-sourced)
      - EBAY_ENVIRONMENT=production
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
      - EBAY_USER_REFRESH_TOKEN=${EBAY_USER_REFRESH_TOKEN}
      - EBAY_MARKETPLACE_ID=EBAY_US
      # Tool surface: a frozen family list (~110 of 299 tools; drops the
      # 83-tool marketing family and the limited-release ones — widen by
      # name as needed). Not `dynamic`: that mode gates the catalogue
      # behind enable/disable meta-tools and relies on the client honoring
      # tools/listChanged to surface what it enables — which Claude Code
      # (anthropics/claude-code#13646) and the claude.ai connector runtime
      # do not, leaving enabled tools permanently uncallable there. The
      # server side is spec-correct (verified end-to-end through Caddy's
      # SSE path 2026-08-20); Claude clients get their context economy
      # from client-side deferred tool loading instead, which the full
      # advertised list composes with fine.
      - EBAY_MCP_TOOLS=connector,token-management,account,inventory,fulfillment,analytics,browse
      # Global write gate (cf. mail's MAIL_*_WRITE_ENABLED): flip to true to
      # register only read-only tools.
      - EBAY_READ_ONLY=false
    ports:
      - "127.0.0.1:8081:8081" # debug via SSM tunnel only (8000/8080 taken)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ebay: {}
