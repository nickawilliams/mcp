<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1694">
  <!-- The "e" from the eBay logotype, cut out of the full wordmark just left
       of the b's stem and re-traced. The wordmark itself is unreadable at
       favicon sizes; the e is the part that still reads at 16px. The mark
       alone. #e53238 is eBay red, the colour this "e" carries in the
       logotype. -->
  <!-- The fill is the brand colour, and it is the ONE hex in this file: the
       generator sniffs it to build the tile gradient, then strips it so the
       mark inherits the tile's ink. Keep it to a single fill — sniffing picks
       the most-repeated hex, not the most prominent one, so a multi-colour
       source would pick by accident. -->
