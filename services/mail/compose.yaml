# mail: multi-account IMAP/SMTP MCP server (tecnologicachile/mail-mcp). The
# upstream binary is stdio-only; supergateway wraps it in-container and
# serves streamable HTTP on :8080. The bridge runs STATELESS — no MCP
# session ids are issued, and each request gets its own short-lived stdio
# child (which inherits this environment).
#
# Stateless is deliberate. Under --stateful the bridge reaped idle sessions
# after --sessionTimeout and SIGTERMed their child; because clients that
# hold no GET/SSE stream (the claude.ai connector sends POSTs only) drop the
# session access count to zero after every response, the timer restarted
# from each tool call and killed the session 10 minutes after the last one —
# mid-conversation, whenever a draft took longer than that. The client's
# recovery from the resulting 404 is unreliable, and reconnecting only
# relit the same fuse. mail-mcp needs none of what a session buys: it
# declares tools-only capabilities (so it never initiates a message to the
# client), its accounts come from this environment, and its message ids are
# IMAP UIDVALIDITY/UID (verified identical across separate child
# processes). Removing the session removes the failure mode outright.
#
# --protocolVersion pins the gateway->child handshake to what mail-mcp
# actually speaks; stateless auto-initializes each child, and the default
# (2024-11-05) is older than the server's 2025-03-26.
# Included by the root docker-compose.yaml with project_directory rooted at
# the app dir (/opt/mcp on the host), so relative paths here are from that
# root, NOT from this file's directory. Only Caddy shares the `mail`
# network — other services cannot reach the unauthenticated bridge.
#
# Plain account config lives here; passwords and OAuth refresh tokens
# interpolate from the host .env (SSM SecureStrings, one per credential,
# fanned out to the account's IMAP/SMTP/Graph vars).
# SMTP Sent-folder saving relies on the provider-aware defaults (v0.4.8+):
# Migadu (generic SMTP) auto-appends, Gmail is saved server-side.
services:
  mail-mcp:
    build:
      context: ./services/mail
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - mail
    command:
      [
        "--stdio", "/usr/local/bin/mail-imap-mcp-rs",
        "--outputTransport", "streamableHttp",
        "--port", "8080",
        "--streamableHttpPath", "/mcp",
        "--healthEndpoint", "/healthz",
        "--protocolVersion", "2025-03-26",
        "--logLevel", "info",
      ]
    environment:
      # Global write gates
      - MAIL_IMAP_WRITE_ENABLED=true
      - MAIL_SMTP_WRITE_ENABLED=true
      # default — Migadu personal
      - MAIL_IMAP_DEFAULT_HOST=imap.migadu.com
      - MAIL_IMAP_DEFAULT_USER=nick@nickawilliams.com
      - MAIL_IMAP_DEFAULT_PASS=${MAIL_DEFAULT_PASSWORD}
      - MAIL_SMTP_DEFAULT_HOST=smtp.migadu.com
      - MAIL_SMTP_DEFAULT_PORT=465
      - MAIL_SMTP_DEFAULT_SECURE=tls
      - MAIL_SMTP_DEFAULT_USER=nick@nickawilliams.com
      - MAIL_SMTP_DEFAULT_PASS=${MAIL_DEFAULT_PASSWORD}
      # accounts — Migadu accounts@
      - MAIL_IMAP_ACCOUNTS_HOST=imap.migadu.com
      - MAIL_IMAP_ACCOUNTS_USER=accounts@nickawilliams.com
      - MAIL_IMAP_ACCOUNTS_PASS=${MAIL_ACCOUNTS_PASSWORD}
      - MAIL_SMTP_ACCOUNTS_HOST=smtp.migadu.com
      - MAIL_SMTP_ACCOUNTS_PORT=465
      - MAIL_SMTP_ACCOUNTS_SECURE=tls
      - MAIL_SMTP_ACCOUNTS_USER=accounts@nickawilliams.com
      - MAIL_SMTP_ACCOUNTS_PASS=${MAIL_ACCOUNTS_PASSWORD}
      # lost — Migadu lost@
      - MAIL_IMAP_LOST_HOST=imap.migadu.com
      - MAIL_IMAP_LOST_USER=lost@nickawilliams.com
      - MAIL_IMAP_LOST_PASS=${MAIL_LOST_PASSWORD}
      - MAIL_SMTP_LOST_HOST=smtp.migadu.com
      - MAIL_SMTP_LOST_PORT=465
      - MAIL_SMTP_LOST_SECURE=tls
      - MAIL_SMTP_LOST_USER=lost@nickawilliams.com
      - MAIL_SMTP_LOST_PASS=${MAIL_LOST_PASSWORD}
      # gmail — personal (app password)
      - MAIL_IMAP_GMAIL_HOST=imap.gmail.com
      - MAIL_IMAP_GMAIL_USER=rogwilco@gmail.com
      - MAIL_IMAP_GMAIL_PASS=${MAIL_GMAIL_PASSWORD}
      - MAIL_SMTP_GMAIL_HOST=smtp.gmail.com
      - MAIL_SMTP_GMAIL_SECURE=starttls
      - MAIL_SMTP_GMAIL_USER=rogwilco@gmail.com
      - MAIL_SMTP_GMAIL_PASS=${MAIL_GMAIL_PASSWORD}
      # work — Clearstory Gmail (NOTE: ~/.profile-mail-mcp wrongly points
      # SMTP at imap.gmail.com; corrected here)
      - MAIL_IMAP_WORK_HOST=imap.gmail.com
      - MAIL_IMAP_WORK_USER=nwilliams@clearstory.build
      - MAIL_IMAP_WORK_PASS=${MAIL_WORK_PASSWORD}
      - MAIL_SMTP_WORK_HOST=smtp.gmail.com
      - MAIL_SMTP_WORK_SECURE=starttls
      - MAIL_SMTP_WORK_USER=nwilliams@clearstory.build
      - MAIL_SMTP_WORK_PASS=${MAIL_WORK_PASSWORD}
      # microsoft — Live.com personal. Microsoft retired basic auth (and app
      # passwords) for personal accounts in 2024, so IMAP authenticates with
      # XOAUTH2 and sending goes through the Graph API — two refresh tokens,
      # because Microsoft refuses to mix outlook.office.com and
      # graph.microsoft.com scopes in one token. Mint both with
      # `make maintenance/microsoft-tokens` (~90-day MSA lifetime). No SMTP
      # pair: Microsoft blocks SMTP AUTH for personal accounts outright. The
      # client id is Thunderbird's public one (see mail-mcp's setup guide),
      # not a secret.
      - MAIL_IMAP_MICROSOFT_HOST=outlook.office365.com
      - MAIL_IMAP_MICROSOFT_USER=nickawilliams@live.com
      - MAIL_OAUTH2_MICROSOFT_PROVIDER=microsoft
      - MAIL_OAUTH2_MICROSOFT_CLIENT_ID=9e5f94bc-e8a4-4e73-b8be-63364c29d753
      - MAIL_OAUTH2_MICROSOFT_CLIENT_SECRET=none
      - MAIL_OAUTH2_MICROSOFT_REFRESH_TOKEN=${MAIL_MICROSOFT_IMAP_TOKEN}
      - MAIL_GRAPH_MICROSOFT_PROVIDER=microsoft
      - MAIL_GRAPH_MICROSOFT_CLIENT_ID=9e5f94bc-e8a4-4e73-b8be-63364c29d753
      - MAIL_GRAPH_MICROSOFT_CLIENT_SECRET=none
      - MAIL_GRAPH_MICROSOFT_REFRESH_TOKEN=${MAIL_MICROSOFT_GRAPH_TOKEN}
    ports:
      - "127.0.0.1:8080:8080" # debug via SSM tunnel only (8000 is graphiti's)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mail: {}
